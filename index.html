<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackWaves Movies</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #333333;
            --accent-color: #ffffff;
            --hover-color: #222222;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
        }

        .config-panel, .search-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--text-color);
            color: var(--bg-color);
            border: 1px solid var(--text-color);
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--bg-color);
            color: var(--text-color);
        }

        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #050505;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        /* No sandboxing applied to the iframe */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .movie-card {
            border: 1px solid var(--border-color);
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .movie-card:hover {
            border-color: var(--accent-color);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background-color: var(--hover-color);
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.2s ease;
        }

        .movie-card:hover .movie-poster {
            filter: grayscale(0%);
        }

        .movie-info {
            padding: 10px;
            font-size: 0.8rem;
        }

        .movie-title {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-year {
            color: #888888;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cinema Player</h1>
            <div class="config-panel">
                <input type="password" id="tmdbApiKey" placeholder="ebbc810d0c9a9a4a13a264f96897036e" />
                <button onclick="saveApiKey()">Save Key</button>
            </div>
            <div class="search-panel">
                <input type="text" id="searchQuery" placeholder="Search for a movie..." onkeypress="handleKeyPress(event)" />
                <button onclick="searchMovies()">Search</button>
            </div>
        </header>

        <main>
            <!-- Player Section -->
            <div class="player-container">
                <iframe id="videoPlayer" src="about:blank" allowfullscreen></iframe>
            </div>

            <!-- Search Results Section -->
            <div class="results-grid" id="searchResults"></div>
        </main>
    </div>

    <script>
        // Load saved API key on startup
        document.getElementById('tmdbApiKey').value = localStorage.getItem('tmdb_key') || '';

        function saveApiKey() {
            const key = document.getElementById('tmdbApiKey').value.trim();
            localStorage.setItem('tmdb_key', key);
            alert('API Key Saved');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchMovies();
            }
        }

        async function searchMovies() {
            const apiKey = localStorage.getItem('tmdb_key');
            const query = document.getElementById('searchQuery').value.trim();
            const resultsContainer = document.getElementById('searchResults');

            if (!apiKey) {
                alert('Please enter and save a TMDB API Key first.');
                return;
            }
            if (!query) return;

            resultsContainer.innerHTML = '<div>Loading...</div>';

            try {
                // Configured to search movies via TMDB v3 API
                const response = await fetch(`https://themoviedb.org{apiKey}&query=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsContainer.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsContainer.innerHTML = '<div>No movies found.</div>';
                    return;
                }

                data.results.forEach(movie => {
                    if (!movie.poster_path) return; // Skip movies with no poster image

                    const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
                    const posterUrl = `https://tmdb.org{movie.poster_path}`;

                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.onclick = () => loadPlayer(movie.id);

                    card.innerHTML = `
                        <img class="movie-poster" src="${posterUrl}" alt="${movie.title}">
                        <div class="movie-info">
                            <div class="movie-title" title="${movie.title}">${movie.title}</div>
                            <div class="movie-year">${releaseYear}</div>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = '<div>Error fetching data. Check your API key or console.</div>';
            }
        }

        function loadPlayer(tmdbId) {
            const player = document.getElementById('videoPlayer');
            // Constructs the vidsrc.sh URL structure for embedded movies
            player.src = `https://vidsrc.sh{tmdbId}`;
            
            // Scroll back up to the player smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
